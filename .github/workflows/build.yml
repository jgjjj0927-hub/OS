# language: YAML, file: .github/workflows/build.yml
name: build-anon-os

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Cache cross toolchain
        uses: actions/cache@v4
        with:
          path: ~/opt/cross
          key: x86_64-elf-gcc-13.2.0-binutils-2.41

      - name: Install base tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            nasm xorriso mtools dosfstools \
            gnu-efi qemu-system-x86 ovmf \
            build-essential bison flex \
            libgmp3-dev libmpc-dev libmpfr-dev texinfo wget

      - name: Build x86_64-elf cross compiler
        run: |
          export PREFIX="$HOME/opt/cross"
          export TARGET=x86_64-elf
          export PATH="$PREFIX/bin:$PATH"

          if [ -x "$PREFIX/bin/$TARGET-gcc" ]; then
            echo "cross compiler cached, skipping build"
            echo "$PREFIX/bin" >> $GITHUB_PATH
            exit 0
          fi

          mkdir -p $PREFIX
          cd /tmp

          wget -q https://ftp.gnu.org/gnu/binutils/binutils-2.41.tar.xz
          tar -xf binutils-2.41.tar.xz
          mkdir build-binutils && cd build-binutils
          ../binutils-2.41/configure --target=$TARGET --prefix="$PREFIX" \
            --with-sysroot --disable-nls --disable-werror
          make -j$(nproc)
          make install
          cd /tmp

          wget -q https://ftp.gnu.org/gnu/gcc/gcc-13.2.0/gcc-13.2.0.tar.xz
          tar -xf gcc-13.2.0.tar.xz
          cd gcc-13.2.0
          ./contrib/download_prerequisites
          cd /tmp
          mkdir build-gcc && cd build-gcc
          ../gcc-13.2.0/configure --target=$TARGET --prefix="$PREFIX" \
            --disable-nls --enable-languages=c --without-headers
          make -j$(nproc) all-gcc all-target-libgcc
          make install-gcc install-target-libgcc

          echo "$PREFIX/bin" >> $GITHUB_PATH

      - name: Verify tools
        run: |
          export PATH="$HOME/opt/cross/bin:$PATH"
          x86_64-elf-gcc --version
          nasm -v
          xorriso --version | head -1
          ls -l /usr/lib/crt0-efi-x86_64.o
          ls -l /usr/share/OVMF/OVMF_CODE.fd

      - name: Build kernel
        run: |
          export PATH="$HOME/opt/cross/bin:$PATH"
          make kernel

      - name: Build loader
        run: make loader

      - name: Build ISO
        run: make iso

      - name: QEMU smoke test
        run: make check

      - name: Show ISO size
        run: ls -lh build/anon-os.iso

      - uses: actions/upload-artifact@v4
        with:
          name: anon-os-iso
          path: build/anon-os.iso
          retention-days: 30
          if-no-files-found: error
